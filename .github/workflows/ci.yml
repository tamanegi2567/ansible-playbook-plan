name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Deny token permissions unless a job explicitly needs them.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python ${{ matrix.python-version }} / Core ${{ matrix.core-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        core-version: ["2.19", "2.20", "2.21"]
        exclude:
          - python-version: "3.14"
            core-version: "2.19"
        include:
          - python-version: "3.11"
            core-version: "2.19"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python-version }}
          # Keep untrusted PR jobs from sharing dependency caches.
          enable-cache: false
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Verify locked Ansible selection
        run: |
          uv run --locked python -c "import sys; from importlib.metadata import version; expected = '2.19.' if sys.version_info[:2] == (3, 11) else '2.21.'; assert version('ansible-core').startswith(expected)"
      - name: Run tests
        run: uv run --locked tox -e "py${PYTHON_VERSION//./}-core${CORE_VERSION//./}"
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          CORE_VERSION: ${{ matrix.core-version }}
      - name: Check lint
        if: matrix.python-version == '3.14' && matrix.core-version == '2.21'
        run: uv run --locked ruff check .
      - name: Check formatting
        if: matrix.python-version == '3.14' && matrix.core-version == '2.21'
        run: uv run --locked ruff format --check .
      - name: Build package
        if: matrix.python-version == '3.14' && matrix.core-version == '2.21'
        run: uv build
      - name: Smoke test wheel
        if: matrix.python-version == '3.14' && matrix.core-version == '2.21'
        run: |
          uv venv /tmp/plan-wheel --python 3.14
          uv pip install --python /tmp/plan-wheel/bin/python dist/*.whl
          /tmp/plan-wheel/bin/ansible-playbook-plan --help
          /tmp/plan-wheel/bin/ansible-playbook-plan -i samples/inventory.yml --forks 1 -e rollout_serial=2 samples/rolling-update.yml
