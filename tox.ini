[tox]
envlist = py311, py313
skip_missing_interpreters = true

[testenv]
allowlist_externals = uv
pass_env = UV_CACHE_DIR
skip_install = true

[testenv:py311]
commands =
    uv run --python 3.11 --locked pytest

[testenv:py313]
commands =
    uv run --python 3.13 --locked pytest
    uv run --python 3.13 --locked ruff check .
    uv run --python 3.13 --locked ruff format --check .
    uv build --python 3.13
