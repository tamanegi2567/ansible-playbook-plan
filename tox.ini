[tox]
envlist = py311-core219, py{312,313}-core{219,220,221}, py314-core{220,221}
skip_missing_interpreters = false

[testenv]
package = wheel
deps =
    pytest>=8.4,<10
    core219: ansible-core>=2.19,<2.20
    core220: ansible-core>=2.20,<2.21
    core221: ansible-core>=2.21,<2.22
commands =
    python -c "import sys; from importlib.metadata import version; print(sys.version); print('ansible-core', version('ansible-core'))"
    python -m pytest
